services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-preauth_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  llm-stub:
    image: localhost/preauth-desk:dev
    command: ["stub"]
    env_file: .env
    environment:
      FAULT_MODE: ${FAULT_MODE:-none}
      STUB_DELAY_MS: ${STUB_DELAY_MS:-250}
      STUB_JITTER_MS: ${STUB_JITTER_MS:-50}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8080:8080"

  api:
    build: .
    image: localhost/preauth-desk:dev
    command: ["api"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  worker:
    image: localhost/preauth-desk:dev
    command: ["worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/metrics"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8001
  - job_name: llm-stub
    static_configs:
      - targets: ["llm-stub:8080"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-preauth_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["observability"]

  llm-stub:
    image: localhost/preauth-desk:dev
    command: ["stub"]
    environment:
      FAULT_MODE: ${FAULT_MODE:-none}
      STUB_DELAY_MS: ${STUB_DELAY_MS:-250}
      STUB_JITTER_MS: ${STUB_JITTER_MS:-50}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8080:8080"

  api:
    build: .
    image: localhost/preauth-desk:dev
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/preauth_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INDEX_STORAGE_DIR: ${INDEX_STORAGE_DIR:-/app/index_data}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm-stub:8080}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-http://jaeger:4317}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-10}
      RATE_LIMIT_REFILL_PER_SECOND: ${RATE_LIMIT_REFILL_PER_SECOND:-1.0}
      GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-true}
    volumes:
      - index_data:/app/index_data:ro

  worker:
    image: localhost/preauth-desk:dev
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-stub:
        condition: service_healthy
      indexer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/metrics"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - index_data:/app/index_data:ro
      - model_cache:/app/model_cache
    environment:
      HF_HOME: /app/model_cache
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/preauth_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INDEX_STORAGE_DIR: ${INDEX_STORAGE_DIR:-/app/index_data}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      MAX_STEPS: ${MAX_STEPS:-12}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-10}
      RUN_TIMEOUT_S: ${RUN_TIMEOUT_S:-90}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-20}
      TOOL_TIMEOUT_S: ${TOOL_TIMEOUT_S:-5}
      MAX_REPLANS: ${MAX_REPLANS:-2}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm-stub:8080}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT:-http://jaeger:4317}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      RETRY_BASE_DELAY_S: ${RETRY_BASE_DELAY_S:-0.5}
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-5}
      CIRCUIT_COOLDOWN_S: ${CIRCUIT_COOLDOWN_S:-30}
      ENABLE_RETRIEVAL_CACHE: ${ENABLE_RETRIEVAL_CACHE:-true}
      RETRIEVAL_CACHE_SIZE: ${RETRIEVAL_CACHE_SIZE:-512}
      DEMO_FORCE_BAD_CITATION: ${DEMO_FORCE_BAD_CITATION:-false}

  indexer:
    image: localhost/preauth-desk:dev
    command: ["ingest"]
    volumes:
      - ./corpus/raw:/app/corpus/raw:ro,Z
      - index_data:/app/index_data
      - model_cache:/app/model_cache
    environment:
      HF_HOME: /app/model_cache
      CORPUS_RAW_DIR: ${CORPUS_RAW_DIR:-/app/corpus/raw}
      INDEX_STORAGE_DIR: ${INDEX_STORAGE_DIR:-/app/index_data}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
    profiles: ["observability"]

  prometheus:
    image: docker.io/prom/prometheus:v2.55.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: docker.io/grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: ["observability"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/containers:/var/lib/containers:ro
    profiles: ["host-metrics"]

volumes:
  postgres_data:
  index_data:
  model_cache:
  prometheus_data:
  grafana_data:

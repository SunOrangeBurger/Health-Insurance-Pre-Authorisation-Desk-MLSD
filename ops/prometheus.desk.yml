global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8001
        refresh_interval: 5s
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
